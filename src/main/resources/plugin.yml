name: SHStaffAlert
version: '${project.version}'
main: org.Cry_Legende.sHStaffAlert.SHStaffAlert
api-version: '1.20'
author: Cry_Legende
# SHNetwork est facultatif : sans lui, seuls les staffs de ce serveur reçoivent l'alerte.
softdepend: [SHNetwork]

commands:
  staffalert:
    description: Envoie un message à tous les staffs connectés.
    usage: /<command> <message>
    permission: shstaffalert.use
  shstaffalert:
    description: Administration de SHStaffAlert. Avec un message, envoie l'alerte comme /staffalert.
    usage: /<command> reload | /<command> <message>

permissions:
  shstaffalert.use:
    description: Envoyer une alerte avec /staffalert (ou /shstaffalert <message>).
    default: op
  shstaffalert.staff:
    description: Reçoit les messages envoyés via /staffalert
    default: false
  shstaffalert.admin:
    description: Toutes les sous-commandes de /shstaffalert.
    default: op
    children:
      shstaffalert.admin.reload: true
  shstaffalert.admin.reload:
    description: /shstaffalert reload, recharge config.yml et messages.yml.
    default: op
