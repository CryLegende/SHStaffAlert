name: SHStaffAlert
version: '${project.version}'
main: org.Cry_Legende.sHStaffAlert.SHStaffAlert
api-version: '1.20'
author: Cry_Legende
# SHNetwork est facultatif : sans lui, seuls les staffs de ce serveur reçoivent l'alerte.
softdepend: [SHNetwork]

commands:
  shstaffalert:
    description: Envoie un message à tous les staffs connectés.
    usage: /shstaffalert <message>
    permission: shstaffalert.command

permissions:
  shstaffalert.command:
    description: Permet d'utiliser la commande /shstaffalert
    default: op
  shstaffalert.staff:
    description: Reçoit les messages envoyés via /shstaffalert
    default: false
