# SHStaffAlert : envoie un message à tous les staffs connectés.
#
# Commandes :
#   /staffalert <message>       Envoie le message (codes couleur &) à tous les joueurs qui ont shstaffalert.staff.
#   /shstaffalert <message>     Ancienne forme, identique à /staffalert (appelée en console par d'autres plugins).
#   /shstaffalert reload        Recharge config.yml et messages.yml ; si un fichier est illisible, l'ancienne
#                               configuration reste active. Doit être le seul argument. La clé reseau.actif demande
#                               un redémarrage.
#
# Permissions :
#   shstaffalert.use            Envoyer une alerte (op par défaut ; la console l'utilise toujours).
#   shstaffalert.staff          Recevoir les messages (personne par défaut, à donner au staff).
#   shstaffalert.admin          Toutes les sous-commandes de /shstaffalert (op par défaut).
#   shstaffalert.admin.reload   /shstaffalert reload (op par défaut).
#
# Les textes sont dans messages.yml.

settings:
  # Écrit aussi chaque alerte dans la console du serveur
  log_to_console: true

# Avec SHNetwork, l'alerte atteint le staff de tous les serveurs du réseau (et la console de chacun si
# log_to_console est actif). Sans SHNetwork, ou à false, seuls les staffs de ce serveur la reçoivent.
# Se lit au démarrage.
reseau:
  actif: true
